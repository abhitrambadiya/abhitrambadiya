name: Generate Profile Cards

on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate self-hosted profile cards
        uses: seijikohara/profile-cards-action@v0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: ${{ github.repository_owner }}
          cards: overview,lifetime,contributions,rhythm,languages
          output-dir: assets/profile-cards
          themes: light,dark
          commit: true
          commit-message: "chore(profile): refresh activity cards [skip ci]"
